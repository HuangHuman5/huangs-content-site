<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Albums — Huang's Content</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>

  /* ---------------------------------------------------------
     ALBUM CATALOG (page-specific, reuses tokens from style.css)
  --------------------------------------------------------- */
  .intro{
    margin: 0 0 32px;
    max-width: 46ch;
  }

  .catalog{
    border-top: 1px solid var(--line);
  }

  .entry{
    border-bottom: 1px solid var(--line);
  }

  .entry-row{
    display:flex;
    align-items:center;
    gap:18px;
    padding:16px 4px;
    cursor:pointer;
    background:none;
    border:none;
    width:100%;
    text-align:left;
    font-family:inherit;
    color:inherit;
  }
  .entry-row:focus-visible{
    outline:2px solid var(--gold-deep);
    outline-offset:-2px;
  }

  .cat-no{
    font-family:var(--serif);
    font-weight:500;
    font-size:0.95rem;
    color:var(--gold-deep);
    width:34px;
    flex-shrink:0;
    font-variant-numeric:tabular-nums;
  }

  .thumb{
    width:52px;
    height:52px;
    flex-shrink:0;
    border-radius:2px;
    object-fit:cover;
    background:var(--ink);
  }
  .thumb.placeholder{
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:var(--serif);
    font-weight:600;
    color:var(--paper);
    font-size:1.1rem;
  }

  .entry-meta{
    flex:1;
    min-width:0;
  }
  .entry-meta .title{
    font-family:var(--serif);
    font-weight:600;
    font-size:1.08rem;
    line-height:1.25;
    margin:0 0 2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .entry-meta .sub{
    font-size:0.83rem;
    color:var(--ink-soft);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .entry-meta .sub .year{
    color:var(--ink-faint);
  }

  .score-stamp{
    flex-shrink:0;
    width:46px;
    height:46px;
    border:1.5px solid var(--ink);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:var(--serif);
    font-weight:600;
    font-size:0.92rem;
    transform:rotate(-4deg);
  }

  .chevron{
    flex-shrink:0;
    width:14px;
    height:14px;
    color:var(--ink-faint);
    transition:transform 0.25s ease;
  }
  .entry.open .chevron{ transform:rotate(180deg); }

  /* ---------------------------------------------------------
     EXPANDED PANEL
  --------------------------------------------------------- */
  .panel-outer{
    display:grid;
    grid-template-rows:0fr;
    transition:grid-template-rows 0.32s ease;
  }
  .entry.open .panel-outer{
    grid-template-rows:1fr;
  }
  .panel-inner{ overflow:hidden; }

  .panel{
    background:var(--paper-raised);
    margin:0 4px 20px;
    padding:24px;
    display:grid;
    grid-template-columns:180px 1fr;
    gap:28px;
    opacity:0;
    transform:translateY(-4px);
    transition:opacity 0.28s ease 0.05s, transform 0.28s ease 0.05s;
  }
  .entry.open .panel{
    opacity:1;
    transform:translateY(0);
  }

  .panel-left img,
  .panel-left .cover-placeholder{
    width:100%;
    aspect-ratio:1;
    border-radius:2px;
    object-fit:cover;
    background:var(--ink);
    display:block;
  }
  .cover-placeholder{
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:var(--serif);
    font-weight:600;
    color:var(--paper);
    font-size:2.2rem;
  }

  .info-list{
    margin-top:14px;
    font-size:0.82rem;
    color:var(--ink-soft);
    line-height:1.9;
  }
  .info-list div{
    display:flex;
    justify-content:space-between;
    border-bottom:1px dotted var(--line);
    padding:1px 0;
  }
  .info-list span:first-child{
    color:var(--ink-faint);
  }

  .panel-right h3{
    font-family:var(--serif);
    font-weight:600;
    font-size:0.78rem;
    letter-spacing:0.02em;
    color:var(--gold-deep);
    margin:0 0 8px;
  }

  .review-text{
    font-size:0.95rem;
    line-height:1.65;
    color:var(--ink);
    margin:0 0 26px;
    max-width:58ch;
  }

  .tracklist{
    list-style:none;
    margin:0;
    padding:0;
  }
  .tracklist li{
    display:flex;
    align-items:baseline;
    gap:12px;
    padding:7px 0;
    border-bottom:1px solid var(--line);
    font-size:0.88rem;
  }
  .tracklist li:last-child{ border-bottom:none; }

  .tk-no{
    font-family:var(--serif);
    color:var(--ink-faint);
    width:18px;
    flex-shrink:0;
    font-variant-numeric:tabular-nums;
  }
  .tk-title{
    flex:1;
    min-width:0;
    color:var(--ink);
  }
  .tk-dur{
    color:var(--ink-faint);
    font-size:0.8rem;
    flex-shrink:0;
  }
  .tk-rating{
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:6px;
    width:70px;
  }
  .tk-bar{
    flex:1;
    height:3px;
    background:var(--line);
    position:relative;
    border-radius:2px;
    overflow:hidden;
  }
  .tk-bar-fill{
    position:absolute;
    inset:0;
    background:var(--gold);
    border-radius:2px;
  }
  .tk-rating-num{
    font-family:var(--serif);
    font-weight:600;
    font-size:0.78rem;
    color:var(--gold-deep);
    width:22px;
    text-align:right;
  }

  @media (max-width:600px){
    .panel{ grid-template-columns:1fr; }
    .panel-left{ display:flex; gap:16px; }
    .panel-left img, .panel-left .cover-placeholder{ width:96px; flex-shrink:0; }
    .info-list{ margin-top:0; flex:1; }
    .entry-meta .sub{ white-space:normal; }
  }

  @media (prefers-reduced-motion:reduce){
    .panel-outer, .panel, .chevron{ transition:none; }
  }

</style>
</head>
<body>

<div class="header"><h1>Album Ratings</h1></div>

<div class="nav">
  <a href="index.html">Home</a>
  <a href="resources.html">Resources</a>
  <a href="blog.html">Blog</a>
  <a href="albums.html">Albums</a>
  <a href="contact.html">Contact</a>
</div>

<div class="container">
  <p class="intro">A running catalog of what I've been listening to, rated track by track.</p>
  <div class="catalog" id="catalog"></div>
</div>

<div class="footer">© 2026 Huang's Content</div>

<script>

/* =============================================================
   DATA
   Album data now lives in data/albums.json (not inline here).
   Each cover path should point into data/covers/, e.g.
   "data/covers/low-tide-radio.jpg". Leave "cover" as an empty
   string to fall back to the lettered placeholder.
============================================================= */
let ALBUMS = [];

/* =============================================================
   RENDER
============================================================= */
function initials(str){
  return str.split(" ").map(w => w[0]).slice(0,2).join("").toUpperCase();
}

function coverEl(album, className){
  if(album.cover){
    return `<img src="${album.cover}" alt="${album.artist} — ${album.title} cover" class="${className}">`;
  }
  return `<div class="${className} placeholder cover-placeholder">${initials(album.title)}</div>`;
}

function renderTrack(t){
  const pct = Math.min(100, (t.rating / 10) * 100);
  return `
    <li>
      <span class="tk-no">${String(t.n).padStart(2,'0')}</span>
      <span class="tk-title">${t.title}</span>
      <span class="tk-dur">${t.duration}</span>
      <span class="tk-rating">
        <span class="tk-bar"><span class="tk-bar-fill" style="width:${pct}%"></span></span>
        <span class="tk-rating-num">${t.rating}</span>
      </span>
    </li>`;
}

function renderEntry(album, index){
  const catNo = String(index + 1).padStart(3, '0');
  const trackItems = album.tracks
    .map((t, i) => renderTrack({ ...t, n: i + 1 }))
    .join("");

  return `
    <div class="entry" data-index="${index}">
      <button class="entry-row" aria-expanded="false">
        <span class="cat-no">${catNo}</span>
        ${coverEl(album, "thumb")}
        <span class="entry-meta">
          <p class="title">${album.title}</p>
          <p class="sub">${album.artist} <span class="year">— ${album.year}</span></p>
        </span>
        <span class="score-stamp">${album.score}</span>
        <svg class="chevron" viewBox="0 0 16 16" fill="none">
          <path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="panel-outer">
        <div class="panel-inner">
          <div class="panel">
            <div class="panel-left">
              ${coverEl(album, "cover-el")}
              <div class="info-list">
                <div><span>Artist</span><span>${album.artist}</span></div>
                <div><span>Year</span><span>${album.year}</span></div>
                <div><span>Genre</span><span>${album.genre}</span></div>
                <div><span>Label</span><span>${album.label}</span></div>
              </div>
            </div>
            <div class="panel-right">
              <h3>Review</h3>
              <p class="review-text">${album.review}</p>
              <h3>Tracklist</h3>
              <ul class="tracklist">${trackItems}</ul>
            </div>
          </div>
        </div>
      </div>
    </div>`;
}

function render(){
  const container = document.getElementById("catalog");
  container.innerHTML = ALBUMS.map(renderEntry).join("");

  container.querySelectorAll(".entry-row").forEach(btn => {
    btn.addEventListener("click", () => {
      const entry = btn.closest(".entry");
      const isOpen = entry.classList.contains("open");

      // close any other open entry (accordion behavior)
      container.querySelectorAll(".entry.open").forEach(e => {
        if(e !== entry){
          e.classList.remove("open");
          e.querySelector(".entry-row").setAttribute("aria-expanded", "false");
        }
      });

      entry.classList.toggle("open", !isOpen);
      btn.setAttribute("aria-expanded", String(!isOpen));
    });
  });
}

fetch("data/albums.json")
  .then(res => {
    if(!res.ok) throw new Error("Failed to load album data");
    return res.json();
  })
  .then(data => {
    ALBUMS = data;
    render();
  })
  .catch(err => {
    document.getElementById("catalog").innerHTML =
      `<p style="color:var(--ink-soft); padding:24px 4px;">Couldn't load album data (${err.message}). If you're viewing this file directly from disk, serve the site over http instead — e.g. GitHub Pages, or "python3 -m http.server".</p>`;
    console.error(err);
  });
</script>

</body>
</html>
